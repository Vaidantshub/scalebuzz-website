<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | ScaleBuzz</title>
  <meta name="robots" content="noindex, follow">
  <script>
    // SPA redirect fallback for GitHub Pages / static hosts without _redirects support
    var l = window.location;
    l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/' + '?p=' + l.pathname.slice(1).split('/').join('/') + (l.search ? l.search : ''));
  </script>
</head>
<body>
  <p>Redirecting…</p>
</body>
</html>
